name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          check-latest: true
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Lint (go vet)
        run: go vet ./...

      - name: Run Tests (with race detector)
        run: go test -v -race ./...

      - name: Build Binary Verification
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/subforge ./cmd/subforge
