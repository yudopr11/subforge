name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: subforge-windows-x64.exe
            asset_name: subforge-windows-x64.exe
          - os: ubuntu-latest
            artifact_name: subforge-linux-x64
            asset_name: subforge-linux-x64
          - os: macos-latest
            artifact_name: subforge-darwin-arm64
            asset_name: subforge-darwin-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies & PyInstaller
        run: |
          uv sync --all-extras
          uv add --dev pyinstaller

      - name: Build standalone binary
        shell: bash
        run: |
          uv run pyinstaller --noconfirm --onefile --name "${{ matrix.artifact_name }}" \
            --collect-all "textual" \
            --collect-all "subforge" \
            src/subforge/cli/main.py

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
