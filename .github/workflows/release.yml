name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            bin_name: subforge-windows-x64
            artifact_file: dist/subforge-windows-x64.exe
          - os: ubuntu-latest
            bin_name: subforge-linux-x64
            artifact_file: dist/subforge-linux-x64
          - os: macos-latest
            bin_name: subforge-darwin-arm64
            artifact_file: dist/subforge-darwin-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies & PyInstaller
        run: |
          uv sync --all-extras
          uv add --dev pyinstaller

      - name: Build standalone binary
        shell: bash
        run: |
          uv run pyinstaller --noconfirm --onefile --name "${{ matrix.bin_name }}" \
            --exclude-module "mypy" \
            --exclude-module "pytest" \
            --exclude-module "_pytest" \
            --exclude-module "unittest" \
            --exclude-module "tkinter" \
            --exclude-module "sqlite3" \
            --exclude-module "setuptools" \
            --exclude-module "distutils" \
            --exclude-module "pkg_resources" \
            --exclude-module "pip" \
            --exclude-module "pydoc" \
            --exclude-module "xmlrpc" \
            --collect-all "textual" \
            --collect-all "subforge" \
            src/subforge/cli/main.py

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.artifact_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
